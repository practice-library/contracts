name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      guard: denylist
  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      guard: removed-paths
  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      guard: release-note
      watch: '["pieces/"]'
      changelog: CHANGES.md
  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      guard: schema-loosening
  size:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      guard: size
      size-fixtures: '["selftest/","examples/","counter-examples/","tests/fixtures/","vendor/","go.sum","inventory.json","cases/"]'
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GONOSUMDB: ""
      GONOSUMCHECK: ""
      GONOPROXY: ""
      GOPRIVATE: ""
      GOINSECURE: ""
      GOVCS: "*:off"
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Module settings, verified download only
        run: |
          test "$(go env GOFLAGS)" = "-mod=readonly"
          test "$(go env GOPROXY)" = "https://proxy.golang.org"
          test "$(go env GOSUMDB)" = "sum.golang.org"
          test -z "$(go env GONOSUMDB)$(go env GONOPROXY)$(go env GOPRIVATE)$(go env GOINSECURE)${GONOSUMCHECK:-}"
          test "$(go env GOVCS)" = "*:off"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOWORK)" = "off"
          echo "modules come only from the proxy and are checked against go.sum"
      - name: Download and verify modules against go.sum
        run: |
          go mod edit -json | jq -r '.Require // [] | .[] | "\(.Path) \(.Version)"' | while read -r m v; do
            grep -qF "$m $v h1:" go.sum && grep -qF "$m $v/go.mod h1:" go.sum || { echo "go.sum lacks $m $v"; exit 1; }
          done
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build and vet
        run: |
          pkgs="$(go list ./...)" || exit 1
          if [ -z "$pkgs" ]; then echo "no Go packages yet: build, vet and test have nothing to check"; exit 0; fi
          go build ./...
          go vet ./...
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: |
          pkgs="$(go list ./...)" || exit 1
          if [ -z "$pkgs" ]; then exit 0; fi
          go test ./...
          git diff --exit-code -- go.mod go.sum
  gate:
    if: always()
    needs: ["leak-scan","denylist","removed-paths","release-note","schema-loosening","size","go"]
    uses: practice-library/.github/.github/workflows/gate.yml@fa14c82916585c4e3357985a0433e60123f3b91d # v3.1.0
    with:
      needs: ${{ toJSON(needs) }}
